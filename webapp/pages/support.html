<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Metron — Поддержка</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .ticket-item {
      padding: var(--space-3) 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .ticket-item + .ticket-item { border-top: 1px solid var(--color-divider); }
    .ticket-text { font-size: var(--text-sm); color: var(--color-text); }
    .ticket-meta { font-size: var(--text-xs); color: var(--color-text-faint); }
    .ticket-status {
      font-size: var(--text-xs);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }
    .ticket-status.pending { color: var(--color-warning); }
    .ticket-status.answered { color: var(--color-success); }

    textarea.input-field {
      resize: none;
      min-height: 100px;
      line-height: 1.5;
    }

    .char-counter {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      text-align: right;
      margin-top: var(--space-1);
    }
    .char-counter.warn { color: var(--color-warning); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <main class="container page">

    <!-- Шапка -->
    <div style="margin-bottom: var(--space-6);">
      <h1 style="font-size: var(--text-xl); font-weight: 700;">Поддержка</h1>
      <p class="text-muted" style="font-size: var(--text-sm); margin-top: var(--space-1);">
        Ответ придёт в боте — следите за уведомлениями
      </p>
    </div>

    <!-- Форма отправки -->
    <div class="card" style="margin-bottom: var(--space-4);">
      <div class="card-title" style="margin-bottom: var(--space-3);">Новое обращение</div>
      <textarea
        class="input-field"
        id="support-text"
        placeholder="Опишите проблему подробно..."
        maxlength="1000"
        oninput="onTextInput()"
      ></textarea>
      <div class="char-counter" id="char-counter">0 / 1000</div>
      <button
        class="btn btn-primary btn-full"
        id="btn-send"
        onclick="sendTicket()"
        style="margin-top: var(--space-3);"
        disabled
      >
        Отправить
      </button>
    </div>

    <!-- История обращений -->
    <div class="card">
      <div class="card-title" style="margin-bottom: var(--space-1);">История обращений</div>
      <div id="tickets-list">
        <div style="padding: var(--space-4) 0; text-align: center;">
          <span style="font-size: var(--text-sm); color: var(--color-text-faint); font-style: italic;">
            Загрузка...
          </span>
        </div>
      </div>
    </div>

  </main>

  <!-- Навбар -->
  <nav class="bottom-nav">
    <a href="profile.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Профиль</span>
    </a>
    <a href="protocols.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Протоколы</span>
    </a>
    <a href="support.html" class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Поддержка</span>
    </a>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast" style="display:none;"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const USER_ID = tg?.initDataUnsafe?.user?.id ?? null;

    // ---- Cooldown (10 сек между отправками) ----
    let lastSentAt = 0;
    const COOLDOWN_MS = 10_000;

    // ---- Счётчик символов ----
    function onTextInput() {
      const ta  = document.getElementById('support-text');
      const cnt = document.getElementById('char-counter');
      const btn = document.getElementById('btn-send');
      const len = ta.value.trim().length;

      cnt.textContent = `${ta.value.length} / 1000`;
      cnt.className   = 'char-counter' + (ta.value.length > 900 ? ' warn' : '');
      btn.disabled    = len < 5;
    }

    // ---- Отправка ----
    async function sendTicket() {
      const ta   = document.getElementById('support-text');
      const text = ta.value.trim();

      if (!USER_ID) { showToast('⚠️ Откройте через Telegram'); return; }
      if (text.length < 5) { showToast('⚠️ Слишком короткое сообщение'); return; }

      const now = Date.now();
      if (now - lastSentAt < COOLDOWN_MS) {
        const sec = Math.ceil((COOLDOWN_MS - (now - lastSentAt)) / 1000);
        showToast(`⏳ Подождите ещё ${sec} сек`);
        return;
      }

      const btn = document.getElementById('btn-send');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Отправляем...';

      try {
        const res = await fetch(`/api/user/${USER_ID}/support`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) throw new Error(res.status);

        lastSentAt = Date.now();
        ta.value = '';
        onTextInput();
        showToast('✅ Обращение отправлено — ждите ответа в боте');
        await loadTickets();
      } catch (e) {
        showToast('❌ Ошибка отправки, попробуйте позже');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Отправить';
      }
    }

    // ---- История ----
    async function loadTickets() {
      if (!USER_ID) {
        renderTickets([]);
        return;
      }
      try {
        const res = await fetch(`/api/user/${USER_ID}/support`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        renderTickets(data.tickets ?? []);
      } catch (e) {
        renderTickets(null);
      }
    }

    function renderTickets(tickets) {
      const list = document.getElementById('tickets-list');

      if (tickets === null) {
        list.innerHTML = `<div style="padding:var(--space-4) 0; text-align:center;">
          <span style="font-size:var(--text-sm); color:var(--color-text-faint);">Ошибка загрузки</span>
        </div>`;
        return;
      }

      if (!tickets.length) {
        list.innerHTML = `<div style="padding:var(--space-4) 0; text-align:center;">
          <span style="font-size:var(--text-sm); color:var(--color-text-faint); font-style:italic;">
            Обращений пока нет
          </span>
        </div>`;
        return;
      }

      list.innerHTML = tickets.map(t => {
        const date     = new Date(t.created_at).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
        const answered = t.status === 'answered';
        const statusHtml = answered
          ? '<span class="ticket-status answered">✅ Отвечено</span>'
          : '<span class="ticket-status pending">⏳ Ожидает</span>';

        return `<div class="ticket-item">
          <div class="ticket-text">${escHtml(t.message)}</div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="ticket-meta">${date}</span>
            ${statusHtml}
          </div>
        </div>`;
      }).join('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      t.style.animation = 'none';
      t.offsetHeight;
      t.style.animation = '';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    // ---- Старт ----
    loadTickets();
  </script>

</body>
</html>
