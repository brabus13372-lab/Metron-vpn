<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Metron — Поддержка</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/support.css">
</head>
<body>

  <main class="container page support-page">

    <div class="support-hero" style="margin-bottom: var(--space-6);">
      <h1 class="support-title" style="font-size: var(--text-xl); font-weight: 700;">Поддержка</h1>
      <p class="text-muted support-subtitle" style="font-size: var(--text-sm); margin-top: var(--space-1);">
        Ответ придёт в боте — следите за уведомлениями
      </p>
    </div>

    <!-- Форма -->
    <div class="card support-form-card" style="margin-bottom: var(--space-4);">
      <div class="card-title" style="margin-bottom: var(--space-3);">Новое обращение</div>

      <textarea
        class="support-textarea"
        id="support-text"
        placeholder="Опишите проблему подробно..."
        maxlength="1000"
        oninput="onTextInput()"
      ></textarea>
      <div class="support-text-hint">Чем подробнее описание, тем быстрее получится помочь.</div>
      <div class="char-counter" id="char-counter">0 / 1000</div>

      <!-- Прикрепить файл — скрыто визуально, логика сохранена -->
      <div class="attach-area" id="attach-area" style="display:none;">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
          Прикрепить файл
        </button>
        <!-- чипы файлов будут добавляться сюда -->
      </div>

      <!-- Скрытый input -->
      <input
        type="file"
        id="file-input"
        multiple
        accept="image/*,video/*,.pdf,.txt,.log"
        style="display:none;"
        onchange="onFilesSelected(this)"
      />

      <button
        class="btn btn-primary btn-full"
        id="btn-send"
        onclick="sendTicket()"
        style="margin-top: var(--space-4);"
        disabled
      >
        Отправить
      </button>
    </div>

    <!-- История -->
    <div class="card support-history-card">
      <div class="support-history-header">
        <div class="card-title" style="margin-bottom: var(--space-1);">История обращений</div>
        <button class="btn btn-ghost support-refresh-btn" id="btn-refresh-tickets" onclick="refreshTickets()" type="button">Обновить</button>
      </div>
      <div id="tickets-list" class="tickets-list" aria-live="polite">
        <div style="padding:var(--space-4) 0; text-align:center;">
          <span style="font-size:var(--text-sm); color:var(--color-text-faint); font-style:italic;">Загрузка...</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Навбар -->
  <nav class="bottom-nav">
    <a href="profile.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Профиль</span>
    </a>
    <a href="protocols.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Протоколы</span>
    </a>
    <a href="support.html" class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Поддержка</span>
    </a>
  </nav>

  <div class="toast" id="toast" style="display:none;"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../assets/js/pages/support.js"></script>

</body>
</html>
