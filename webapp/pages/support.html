<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Metron — Поддержка</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    /* ---- Textarea ---- */
    .support-textarea {
      width: 100%;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-sm);
      font-family: var(--font-body);
      color: var(--color-text);
      resize: none;
      min-height: 110px;
      line-height: 1.6;
      transition: border-color 180ms ease;
      display: block;
      box-sizing: border-box;
    }
    .support-textarea::placeholder { color: var(--color-text-faint); }
    .support-textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    /* ---- Char counter ---- */
    .char-counter {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      text-align: right;
      margin-top: var(--space-1);
    }
    .char-counter.warn { color: var(--color-warning); }

    /* ---- File attach area ---- */
    .attach-area {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-top: var(--space-3);
    }

    .attach-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      border: 1px dashed var(--color-border);
      background: transparent;
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      font-weight: 500;
      cursor: pointer;
      transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .attach-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: var(--color-primary-glow);
    }
    .attach-btn:active { transform: scale(0.96); }

    /* ---- File preview chips ---- */
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-2);
      background: var(--color-surface-offset);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      max-width: 140px;
    }
    .file-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-chip-remove {
      flex-shrink: 0;
      color: var(--color-text-faint);
      cursor: pointer;
      line-height: 1;
      font-size: 14px;
    }
    .file-chip-remove:hover { color: var(--color-error); }

    /* ---- Tickets ---- */
    .ticket-item {
      padding: var(--space-3) 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .ticket-item + .ticket-item { border-top: 1px solid var(--color-divider); }
    .ticket-text { font-size: var(--text-sm); color: var(--color-text); }
    .ticket-meta { font-size: var(--text-xs); color: var(--color-text-faint); }
    .ticket-status {
      font-size: var(--text-xs);
      font-weight: 600;
    }
    .ticket-status.pending  { color: var(--color-warning); }
    .ticket-status.answered { color: var(--color-success); }

    /* ---- Spinner ---- */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <main class="container page">

    <div style="margin-bottom: var(--space-6);">
      <h1 style="font-size: var(--text-xl); font-weight: 700;">Поддержка</h1>
      <p class="text-muted" style="font-size: var(--text-sm); margin-top: var(--space-1);">
        Ответ придёт в боте — следите за уведомлениями
      </p>
    </div>

    <!-- Форма -->
    <div class="card" style="margin-bottom: var(--space-4);">
      <div class="card-title" style="margin-bottom: var(--space-3);">Новое обращение</div>

      <textarea
        class="support-textarea"
        id="support-text"
        placeholder="Опишите проблему подробно..."
        maxlength="1000"
        oninput="onTextInput()"
      ></textarea>
      <div class="char-counter" id="char-counter">0 / 1000</div>

      <!-- Прикрепить файл — скрыто визуально, логика сохранена -->
      <div class="attach-area" id="attach-area" style="display:none;">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
          Прикрепить файл
        </button>
        <!-- чипы файлов будут добавляться сюда -->
      </div>

      <!-- Скрытый input -->
      <input
        type="file"
        id="file-input"
        multiple
        accept="image/*,video/*,.pdf,.txt,.log"
        style="display:none;"
        onchange="onFilesSelected(this)"
      />

      <button
        class="btn btn-primary btn-full"
        id="btn-send"
        onclick="sendTicket()"
        style="margin-top: var(--space-4);"
        disabled
      >
        Отправить
      </button>
    </div>

    <!-- История -->
    <div class="card">
      <div class="card-title" style="margin-bottom: var(--space-1);">История обращений</div>
      <div id="tickets-list">
        <div style="padding:var(--space-4) 0; text-align:center;">
          <span style="font-size:var(--text-sm); color:var(--color-text-faint); font-style:italic;">Загрузка...</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Навбар -->
  <nav class="bottom-nav">
    <a href="profile.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Профиль</span>
    </a>
    <a href="protocols.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Протоколы</span>
    </a>
    <a href="support.html" class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Поддержка</span>
    </a>
  </nav>

  <div class="toast" id="toast" style="display:none;"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    // Telegram initData имеет приоритет; ?uid=123 — fallback для dev/local
    const _tgId  = tg?.initDataUnsafe?.user?.id ?? null;
    const _params = new URLSearchParams(window.location.search);
    const _uidParam = _params.get('uid') ? parseInt(_params.get('uid'), 10) : null;
    const USER_ID = _tgId ?? _uidParam;

    let lastSentAt = 0;
    const COOLDOWN_MS = 10_000;

    // Файлы: храним как { file, name, size }
    let attachedFiles = [];
    const MAX_FILES    = 5;
    const MAX_SIZE_MB  = 10;

    // ---- Textarea ----
    function onTextInput() {
      const ta  = document.getElementById('support-text');
      const cnt = document.getElementById('char-counter');
      cnt.textContent = `${ta.value.length} / 1000`;
      cnt.className   = 'char-counter' + (ta.value.length > 900 ? ' warn' : '');
      updateSendBtn();
    }

    function updateSendBtn() {
      const ta  = document.getElementById('support-text');
      const btn = document.getElementById('btn-send');
      btn.disabled = !USER_ID || ta.value.trim().length < 5;
    }

    // ---- Файлы ----
    function onFilesSelected(input) {
      const files = Array.from(input.files);
      for (const file of files) {
        if (attachedFiles.length >= MAX_FILES) {
          showToast(`⚠️ Максимум ${MAX_FILES} файлов`);
          break;
        }
        if (file.size > MAX_SIZE_MB * 1024 * 1024) {
          showToast(`⚠️ ${file.name} слишком большой (макс ${MAX_SIZE_MB} МБ)`);
          continue;
        }
        if (attachedFiles.find(f => f.name === file.name)) continue;
        attachedFiles.push(file);
      }
      input.value = '';
      renderFileChips();
    }

    function removeFile(name) {
      attachedFiles = attachedFiles.filter(f => f.name !== name);
      renderFileChips();
    }

    function renderFileChips() {
      const area = document.getElementById('attach-area');
      area.querySelectorAll('.file-chip').forEach(el => el.remove());
      for (const file of attachedFiles) {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `
          <span>${escHtml(file.name)}</span>
          <span class="file-chip-remove" onclick="removeFile('${escHtml(file.name)}')" title="Удалить">×</span>
        `;
        area.appendChild(chip);
      }
    }

    // ---- Отправка ----
    async function sendTicket() {
      const ta   = document.getElementById('support-text');
      const text = ta.value.trim();

      if (!USER_ID)        { showToast('⚠️ Откройте через Telegram'); return; }
      if (text.length < 5) { showToast('⚠️ Слишком короткое сообщение'); return; }

      const now = Date.now();
      if (now - lastSentAt < COOLDOWN_MS) {
        const sec = Math.ceil((COOLDOWN_MS - (now - lastSentAt)) / 1000);
        showToast(`⏳ Подождите ещё ${sec} сек`);
        return;
      }

      const btn = document.getElementById('btn-send');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Отправляем...';

      try {
        const form = new FormData();
        form.append('message', text);
        for (const file of attachedFiles) {
          form.append('files', file, file.name);
        }

        const res = await fetch(`/api/user/${USER_ID}/support`, {
          method: 'POST',
          body: form,
        });
        if (!res.ok) throw new Error(res.status);

        lastSentAt    = Date.now();
        ta.value      = '';
        attachedFiles = [];
        renderFileChips();
        onTextInput();
        showToast('✅ Обращение отправлено — ждите ответа в боте');
        await loadTickets();
      } catch (e) {
        showToast('❌ Ошибка отправки, попробуйте позже');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Отправить';
      }
    }

    // ---- История ----
    async function loadTickets() {
      if (!USER_ID) {
        renderTickets(null);
        showToast('⚠️ Откройте приложение через Telegram');
        return;
      }
      try {
        const res = await fetch(`/api/user/${USER_ID}/support`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        renderTickets(data.tickets ?? []);
      } catch {
        renderTickets(null);
      }
    }

    function renderTickets(tickets) {
      const list = document.getElementById('tickets-list');
      if (tickets === null) {
        list.innerHTML = `<div style="padding:var(--space-4) 0;text-align:center;">
          <span style="font-size:var(--text-sm);color:var(--color-text-faint);">Ошибка загрузки</span></div>`;
        return;
      }
      if (!tickets.length) {
        list.innerHTML = `<div style="padding:var(--space-4) 0;text-align:center;">
          <span style="font-size:var(--text-sm);color:var(--color-text-faint);font-style:italic;">Обращений пока нет</span></div>`;
        return;
      }
      list.innerHTML = tickets.map(t => {
        const date = new Date(t.created_at).toLocaleString('ru-RU', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });
        const answered  = t.status === 'answered';
        const statusHtml = answered
          ? '<span class="ticket-status answered">✅ Отвечено</span>'
          : '<span class="ticket-status pending">⏳ Ожидает</span>';
        const filesHtml = t.files?.length
          ? `<span style="font-size:var(--text-xs);color:var(--color-text-faint);">📎 ${t.files.length} файл(а)</span>`
          : '';
        return `<div class="ticket-item">
          <div class="ticket-text">${escHtml(t.message)}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);">
            <span class="ticket-meta">${date} ${filesHtml}</span>
            ${statusHtml}
          </div>
        </div>`;
      }).join('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      t.style.animation = 'none';
      t.offsetHeight;
      t.style.animation = '';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    loadTickets();
  </script>

</body>
</html>
