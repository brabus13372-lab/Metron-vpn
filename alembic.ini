# Alembic configuration — Metron-vpn
# DB URL is read from DATABASE_URL env var inside env.py.
# Do NOT put credentials here.

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 60

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
